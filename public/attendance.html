<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance</title>
  <link rel="icon" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Attendance</h1>
    <div class="panel">
      <label>Class <select id="class"></select></label>
      <label>Date <input id="date" type="date" required></label>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Student</th><th>Status</th>
            <th>Present</th><th>Late</th><th>Excused</th><th>Absent</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="actions bar">
      <button id="all" type="button" class="ghost">Mark all present</button>
      <button id="save" type="button" class="primary">Save attendance</button>
      <p id="msg" role="alert"></p>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script src="/js/attendance.js"></script>
</body>
</html>
